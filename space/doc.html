<style>
  :root { --bg:#f7f7f5; --surface:#fff; --surface-2:#f1f1ee; --fg:#16171a; --muted:#62646b; --faint:#9a9ca3; --line:#e4e4e0; --accent:#2b59c3; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1013; --surface:#17181c; --surface-2:#1e2025; --fg:#ececef; --muted:#a2a4ab; --faint:#6d7078; --line:#2a2c32; --accent:#86a8ff; } }

  a { color:var(--accent); text-decoration:none; } a:hover { text-decoration:underline; }
  header.top { position:sticky; top:0; z-index:10; background:color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); }

  article h1 { font-size:34px; line-height:1.2; letter-spacing:-.02em; margin:0 0 18px; }
  article h2 { font-size:22px; letter-spacing:-.01em; margin:40px 0 10px; padding-top:10px; border-top:1px solid var(--line); }
  article h3 { font-size:18px; margin:28px 0 8px; }
  article p, article li { color:var(--fg); } article li { margin:4px 0; }
  code { font-family:"JetBrains Mono", ui-monospace, monospace; font-size:.9em; background:var(--surface-2); padding:1px 5px; border-radius:5px; }
  pre { background:var(--surface-2); border:1px solid var(--line); border-radius:10px; overflow:auto; padding:0; }
  pre code { display:block; padding:14px 16px; background:transparent; font-size:13px; line-height:1.55; }
  table { border-collapse:collapse; width:100%; font-size:14px; margin:16px 0; display:block; overflow-x:auto; }
  th, td { border-bottom:1px solid var(--line); padding:8px 10px; text-align:left; vertical-align:top; }

  blockquote { margin:16px 0; padding:4px 16px; border-left:3px solid var(--accent); color:var(--muted); }

<script id="md" type="text/markdown">__MARKDOWN__</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
  const repo = "https://github.com/CY-HYUN/text2cad-verifier/blob/main/";
  const local = { "docs/case_study.md": "case-study.html", "case_study.md": "case-study.html", "README.md": "method.html", "../README.md": "method.html" };
  const doc = document.getElementById("doc");
  doc.innerHTML = marked.parse(document.getElementById("md").textContent);
  doc.querySelectorAll("a[href]").forEach(a => {
    const h = a.getAttribute("href");
    if (/^(https?:|#|mailto:)/.test(h)) { if (/^https?:/.test(h) && !h.includes("cy-hyun.github.io")) { a.target = "_blank"; a.rel = "noopener"; } return; }
    if (local[h]) { a.href = local[h]; return; }
    a.href = repo + h.replace(/^\.\.\//, "").replace(/^\.\//, ""); a.target = "_blank"; a.rel = "noopener";
  });
  doc.querySelectorAll("pre code").forEach(c => hljs.highlightElement(c));
  doc.insertAdjacentHTML("beforeend", `<div class="src">Source: <a href="${repo}__SRC__" target="_blank" rel="noopener">__SRC__ on GitHub ↗</a></div>`);
</script>
