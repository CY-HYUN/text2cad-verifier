[project]
name = "text2cad-verifier"
version = "0.1.0"
description = "Text-to-CadQuery with an execution verifier on the public Text2CAD-Bench preview"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.12.1",
    "cadquery>=2.8.0",
]

[project.optional-dependencies]
serve = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27"]
